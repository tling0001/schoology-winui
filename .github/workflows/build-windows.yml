name: Build Schoology WinUI 3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package (${{ matrix.architecture }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            rid: win-x64
          - architecture: ARM64
            rid: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.427

      - name: Setup Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build WinUI app
        shell: pwsh
        run: |
          msbuild Schoology.WinUI/Schoology.WinUI.csproj /restore /t:Build /p:Configuration=Release /p:Platform=${{ matrix.architecture }} /p:RuntimeIdentifier=${{ matrix.rid }} /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true

      - name: Publish self-contained app
        shell: pwsh
        run: |
          msbuild Schoology.WinUI/Schoology.WinUI.csproj /t:Publish /p:Configuration=Release /p:Platform=${{ matrix.architecture }} /p:RuntimeIdentifier=${{ matrix.rid }} /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true /p:SelfContained=true /p:PublishDir="publish\${{ matrix.rid }}\"

      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = "publish/${{ matrix.rid }}/Schoology.WinUI.exe"
          if (!(Test-Path $exe)) { throw "Expected executable was not produced: $exe" }
          Write-Host "Verified executable: $exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build per-user installer for the Tauri install directory
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup' -Filter 'ISCC.exe' -Recurse | Select-Object -First 1
          if (!$iscc) { throw 'Inno Setup compiler was not found.' }
          & $iscc.FullName /DArchitecture=${{ matrix.architecture }} /DSourceDir="publish\${{ matrix.rid }}" installer\Schoology-WinUI.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer and published files
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-WinUI-${{ matrix.rid }}
          path: |
            installer-output/*.exe
            publish/${{ matrix.rid }}/**
          if-no-files-found: error
          retention-days: 14
