name: Build Schoology WinUI 3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Match the classic Tauri workflow: a newer run for the same ref supersedes older work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and package (${{ matrix.architecture }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            rid: win-x64
          - architecture: ARM64
            rid: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build WinUI app
        shell: pwsh
        run: |
          msbuild Schoology.WinUI/Schoology.WinUI.csproj /restore /t:Build /p:Configuration=Release /p:Platform=${{ matrix.architecture }} /p:RuntimeIdentifier=${{ matrix.rid }} /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=false /p:SelfContained=true

      - name: Publish self-contained app
        shell: pwsh
        run: |
          msbuild Schoology.WinUI/Schoology.WinUI.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=${{ matrix.architecture }} /p:RuntimeIdentifier=${{ matrix.rid }} /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=false /p:SelfContained=true /p:PublishDir="..\publish\${{ matrix.rid }}\"

      - name: Verify published executable, runtime, and WinUI XAML resources
        shell: pwsh
        run: |
          $publishDir = "publish/${{ matrix.rid }}"
          $exe = Join-Path $publishDir "Schoology.WinUI.exe"
          if (!(Test-Path $exe)) { throw "Expected executable was not produced: $exe" }
          Write-Host "Verified executable: $exe"

          foreach ($requiredFile in @("hostfxr.dll", "hostpolicy.dll", "coreclr.dll")) {
            $runtimeFile = Join-Path $publishDir $requiredFile
            if (!(Test-Path $runtimeFile)) { throw "Self-contained .NET runtime file is missing: $runtimeFile" }
          }

          $runtimeConfigPath = Join-Path $publishDir "Schoology.WinUI.runtimeconfig.json"
          if (!(Test-Path $runtimeConfigPath)) { throw "Missing runtime configuration: $runtimeConfigPath" }
          $runtimeConfig = Get-Content $runtimeConfigPath -Raw | ConvertFrom-Json
          $hasBundledFramework = $null -ne $runtimeConfig.runtimeOptions.includedFrameworks -and @($runtimeConfig.runtimeOptions.includedFrameworks | Where-Object { $_.name -eq "Microsoft.NETCore.App" -and $_.version -like "10.0.*" }).Count -gt 0
          if (!$hasBundledFramework) { throw "Published app does not declare its bundled .NET 10 framework." }

          $priFiles = @(Get-ChildItem -Path $publishDir -Filter "*.pri" -File)
          if ($priFiles.Count -eq 0) { throw "Published WinUI app is missing its PRI resource index; compiled XAML cannot be resolved." }
          $priFiles | ForEach-Object { Write-Host "Verified WinUI resource index: $($_.Name)" }
          Write-Host "Verified self-contained .NET 10 runtime and WinUI XAML resources."

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build per-user installer for the Tauri install directory
        shell: pwsh
        run: |
          $iscc = $null
          $candidates = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\lib\innosetup\tools\ISCC.exe"
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) { $iscc = $candidate; break }
          }
          if (!$iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (!$iscc) { throw 'Inno Setup compiler was not found in the standard install locations.' }
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE "publish\${{ matrix.rid }}"
          $version = (Select-Xml -Path "Schoology.WinUI/Schoology.WinUI.csproj" -XPath "//*[local-name()='Version']").Node.InnerText
          $runtimeArchitecture = "${{ matrix.architecture }}".ToLowerInvariant()
          $runtimeUrl = "https://aka.ms/windowsappsdk/1.8/1.8.260804001/windowsappruntimeinstall-$runtimeArchitecture.exe"
          $runtimeDownload = Join-Path $env:RUNNER_TEMP "WindowsAppRuntimeInstall-$runtimeArchitecture.exe"
          Invoke-WebRequest -Uri $runtimeUrl -OutFile $runtimeDownload
          if (!(Test-Path $runtimeDownload)) { throw "Windows App SDK runtime prerequisite could not be downloaded: $runtimeDownload" }
          $runtimeHash = (Get-FileHash -LiteralPath $runtimeDownload -Algorithm SHA256).Hash
          $runtimeSize = (Get-Item -LiteralPath $runtimeDownload).Length
          & $iscc "/DArchitecture=${{ matrix.architecture }}" "/DAppVersion=$version" "/DSourceDir=$sourceDir" "/DRuntimeInstallerUrl=$runtimeUrl" "/DRuntimeInstallerHash=$runtimeHash" "/DRuntimeInstallerSize=$runtimeSize" "installer\Schoology-WinUI.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer and published files
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-WinUI-${{ matrix.rid }}
          path: |
            installer-output/*.exe
            publish/${{ matrix.rid }}/**
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned Schoology release
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version and matching release notes
        id: release_meta
        shell: bash
        run: |
          VERSION="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("Schoology.WinUI/Schoology.WinUI.csproj").findtext(".//Version"))')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 - "$VERSION" RELEASE_NOTES.md release-notes.md <<'PY'
          import sys
          from pathlib import Path
          version, source, destination = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          selected = []
          for section in text.split("## [")[1:]:
              heading, separator, remainder = section.partition("]")
              if separator and heading == version:
                  selected.append("## [" + heading + "]" + remainder)
          if not selected:
              raise SystemExit(f"No release notes found for {version}")
          Path(destination).write_text("\n\n".join(selected).strip() + "\n", encoding="utf-8")
          PY
      - name: Download architecture installers
        uses: actions/download-artifact@v4
        with:
          pattern: Schoology-WinUI-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          mapfile -d '' installers < <(find release-assets -type f -name 'Schoology-*-Setup.exe' -print0)
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "No x64/ARM64 installer artifacts were downloaded." >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file release-notes.md
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md --target main
          fi
          gh release upload "$VERSION" "${installers[@]}" --clobber
