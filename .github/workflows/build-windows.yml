name: Build Schoology WinUI 3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package (${{ matrix.architecture }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            rid: win-x64
          - architecture: ARM64
            rid: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build WinUI app
        shell: pwsh
        run: |
          msbuild Schoology.WinUI/Schoology.WinUI.csproj /restore /t:Build /p:Configuration=Release /p:Platform=${{ matrix.architecture }} /p:RuntimeIdentifier=${{ matrix.rid }} /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true /p:SelfContained=true

      - name: Publish self-contained app
        shell: pwsh
        run: |
          msbuild Schoology.WinUI/Schoology.WinUI.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=${{ matrix.architecture }} /p:RuntimeIdentifier=${{ matrix.rid }} /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true /p:SelfContained=true /p:PublishDir="..\publish\${{ matrix.rid }}\"

      - name: Verify published executable and bundled .NET runtime
        shell: pwsh
        run: |
          $publishDir = "publish/${{ matrix.rid }}"
          $exe = Join-Path $publishDir "Schoology.WinUI.exe"
          if (!(Test-Path $exe)) { throw "Expected executable was not produced: $exe" }
          Write-Host "Verified executable: $exe"

          foreach ($requiredFile in @("hostfxr.dll", "hostpolicy.dll", "coreclr.dll")) {
            $runtimeFile = Join-Path $publishDir $requiredFile
            if (!(Test-Path $runtimeFile)) { throw "Self-contained .NET runtime file is missing: $runtimeFile" }
          }

          $runtimeConfigPath = Join-Path $publishDir "Schoology.WinUI.runtimeconfig.json"
          if (!(Test-Path $runtimeConfigPath)) { throw "Missing runtime configuration: $runtimeConfigPath" }
          $runtimeConfig = Get-Content $runtimeConfigPath -Raw | ConvertFrom-Json
          $hasBundledFramework = $null -ne $runtimeConfig.runtimeOptions.includedFrameworks -and @($runtimeConfig.runtimeOptions.includedFrameworks | Where-Object { $_.name -eq "Microsoft.NETCore.App" -and $_.version -like "10.0.*" }).Count -gt 0
          if (!$hasBundledFramework) { throw "Published app does not declare its bundled .NET 10 framework." }
          Write-Host "Verified self-contained .NET 10 runtime files and runtime configuration."

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build per-user installer for the Tauri install directory
        shell: pwsh
        run: |
          $iscc = $null
          $candidates = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\lib\innosetup\tools\ISCC.exe"
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) { $iscc = $candidate; break }
          }
          if (!$iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (!$iscc) { throw 'Inno Setup compiler was not found in the standard install locations.' }
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE "publish\${{ matrix.rid }}"
          & $iscc "/DArchitecture=${{ matrix.architecture }}" "/DSourceDir=$sourceDir" "installer\Schoology-WinUI.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer and published files
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-WinUI-${{ matrix.rid }}
          path: |
            installer-output/*.exe
            publish/${{ matrix.rid }}/**
          if-no-files-found: error
          retention-days: 14
